name: Scheduled Health Monitor

on:
  schedule:
    # Every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: false
        default: 'production'

jobs:
  health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    permissions:
      issues: read
      actions: read
    steps:
      - name: Check /api/health endpoint
        id: health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://www.aurevonvc.com' }}
          # Optional. When set, the authed readiness report is requested (503 = not ready).
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          # The body goes to a runner-temp file only. It is never put in step
          # outputs, env or logs; the parse step reads the file and prints names/states.
          BODY_FILE="$RUNNER_TEMP/health.json"
          if [ -n "$INTERNAL_API_SECRET" ]; then
            MODE=authed
            HTTP_STATUS=$(curl -s --max-time 30 -o "$BODY_FILE" -w "%{http_code}" \
              -H "Authorization: Bearer $INTERNAL_API_SECRET" "$PRODUCTION_URL/api/health" || true)
          else
            MODE=public
            HTTP_STATUS=$(curl -s --max-time 30 -o "$BODY_FILE" -w "%{http_code}" "$PRODUCTION_URL/api/health" || true)
          fi
          HTTP_STATUS=${HTTP_STATUS:-000}
          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Mode: $MODE   HTTP Status: $HTTP_STATUS"

      - name: Parse health response
        id: parse
        env:
          HEALTH_MODE: ${{ steps.health.outputs.mode }}
          HEALTH_HTTP: ${{ steps.health.outputs.status }}
        run: |
          python3 << 'PYEOF'
          import sys, json, os
          path = os.path.join(os.environ.get('RUNNER_TEMP', '.'), 'health.json')
          try:
              with open(path, encoding='utf-8') as fh:
                  raw = fh.read()
          except OSError as e:
              print(f"::error::No health response body to parse (HTTP {os.environ.get('HEALTH_HTTP', '')}): {e.strerror}")
              sys.exit(1)
          mode = os.environ.get('HEALTH_MODE', 'public')
          http = os.environ.get('HEALTH_HTTP', '')
          try:
              data = json.loads(raw)
          except Exception as e:
              print(f"::error::Failed to parse health JSON (HTTP {http}): {e}")
              sys.exit(1)

          def names(items):
              # Key NAMES only — never values.
              out = []
              for it in items or []:
                  if isinstance(it, dict):
                      out.append(f"{it.get('found', '?')} -> {it.get('expected', '?')}")
                  else:
                      out.append(str(it))
              return out

          ok = data.get('ok') is True
          status = data.get('status', 'unknown')
          database = data.get('database', 'unknown')
          print(f"Mode:           {mode}")
          print(f"OK:             {ok}")
          print(f"Status:         {status}")
          print(f"Database:       {database}")

          env = data.get('env') if isinstance(data.get('env'), dict) else {}
          env_status = 'n/a (public)' if mode != 'authed' else ('complete' if env.get('complete') else 'partial')
          fn = f"{data.get('function_count', '?')}/{data.get('function_limit', '?')}"
          pipeline = data.get('pipeline', 'unknown')
          if mode == 'authed':
              stripe = data.get('stripe') or {}
              crons = data.get('crons') or {}
              queue = data.get('queue') or {}
              print(f"Problems:       {', '.join(names(data.get('problems'))) or 'none'}")
              print(f"Env (required): {env_status}")
              for n in names(env.get('missing_required')):
                  print(f"  missing:      {n}")
              for n in names(env.get('misnamed')):
                  print(f"  misnamed:     {n}")
              print(f"Stripe events:  {'ok' if stripe.get('webhook_events_ok') else stripe.get('webhook_events_ok')}")
              for n in names(stripe.get('missing_events')):
                  print(f"  missing event: {n}")
              print(f"Crons stale:    {crons.get('stale')}")
              print(f"Queue:          " + ', '.join(f"{k}={v}" for k, v in queue.items() if isinstance(v, (int, type(None)))))
              print(f"Functions:      {fn}")

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"HEALTH_PIPELINE={pipeline}\n")
              f.write(f"HEALTH_STATUS={status}\n")
              f.write(f"HEALTH_ENV={env_status}\n")
              f.write(f"HEALTH_FN={fn}\n")

          ready = not (http == '503' or not ok)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
              f.write(f"problems={', '.join(names(data.get('problems'))) or 'see parse step'}\n")
          if not ready:
              print(f"::error::/api/health reports NOT READY (HTTP {http}, ok={data.get('ok')})")
          if mode != 'authed':
              print("::notice::INTERNAL_API_SECRET repository secret not set — public liveness check only.")
          PYEOF

      - name: Check page routes
        id: routes
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://www.aurevonvc.com' }}
        run: |
          ROUTES=(
            "$PRODUCTION_URL/"
            "$PRODUCTION_URL/aurevon-re"
            "$PRODUCTION_URL/aurevon-web3"
            "$PRODUCTION_URL/aurevon-nft"
            "$PRODUCTION_URL/merch"
            "$PRODUCTION_URL/portal"
            "$PRODUCTION_URL/operator"
            "$PRODUCTION_URL/api/health"
            "$PRODUCTION_URL/success"
          )
          ALL_OK=true
          ROUTE_RESULTS=""
          for ROUTE in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ROUTE")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "OK ($STATUS): $ROUTE"
              ROUTE_RESULTS="${ROUTE_RESULTS}✅ ${STATUS} — ${ROUTE}\n"
            else
              echo "FAIL ($STATUS): $ROUTE"
              ROUTE_RESULTS="${ROUTE_RESULTS}❌ ${STATUS} — ${ROUTE}\n"
              ALL_OK=false
            fi
          done
          echo "all_ok=$ALL_OK" >> $GITHUB_OUTPUT
          {
            echo "results<<ENDOFRESULTS"
            echo -e "$ROUTE_RESULTS"
            echo "ENDOFRESULTS"
          } >> $GITHUB_OUTPUT
          if [ "$ALL_OK" = false ]; then
            echo "::error::One or more routes returned non-2xx/3xx status"
            exit 1
          fi

      - name: Check open GitHub issues (bug / customer-reported / UX)
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # All open issues
          TOTAL=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq 'length')
          # Bug-labelled
          BUGS=$(gh api "repos/$REPO/issues?state=open&labels=bug&per_page=100" --jq 'length')
          # Customer-reported
          CUSTOMER=$(gh api "repos/$REPO/issues?state=open&labels=customer-reported&per_page=100" --jq 'length' 2>/dev/null || echo 0)
          # UX / UI
          UX=$(gh api "repos/$REPO/issues?state=open&labels=UX%2FUI&per_page=100" --jq 'length' 2>/dev/null || echo 0)
          echo "total_open=$TOTAL" >> $GITHUB_OUTPUT
          echo "bugs=$BUGS" >> $GITHUB_OUTPUT
          echo "customer=$CUSTOMER" >> $GITHUB_OUTPUT
          echo "ux=$UX" >> $GITHUB_OUTPUT
          echo "Open issues: total=$TOTAL  bugs=$BUGS  customer-reported=$CUSTOMER  UX/UI=$UX"

      - name: Check recent CI run status
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          # Last 5 CI — Lint & Validate runs
          RESULTS=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?per_page=5" \
            --jq '.workflow_runs[] | "\(.conclusion) \(.created_at)"' 2>/dev/null || echo "unavailable")
          FAILURES=$(echo "$RESULTS" | grep -c "^failure" || true)
          LAST=$(echo "$RESULTS" | head -1)
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT
          echo "last_run=$LAST" >> $GITHUB_OUTPUT
          echo "Recent CI runs:"
          echo "$RESULTS"

      - name: Write health summary
        if: always()
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://www.aurevonvc.com' }}
        run: |
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          HTTP_STATUS="${{ steps.health.outputs.status }}"
          ALL_ROUTES="${{ steps.routes.outputs.all_ok }}"
          TOTAL_ISSUES="${{ steps.issues.outputs.total_open }}"
          BUGS="${{ steps.issues.outputs.bugs }}"
          BUGS="${BUGS:-0}"
          CUSTOMER="${{ steps.issues.outputs.customer }}"
          UX="${{ steps.issues.outputs.ux }}"
          CI_FAILURES="${{ steps.ci.outputs.failures }}"
          CI_FAILURES="${CI_FAILURES:-0}"

          # Determine overall status
          if [ "$HTTP_STATUS" = "200" ] && [ "$ALL_ROUTES" = "true" ] && [ "$BUGS" = "0" ]; then
            OVERALL="✅ All systems healthy"
            BADGE="passing"
          elif [ "$BUGS" -gt 0 ] || [ "$HTTP_STATUS" != "200" ]; then
            OVERALL="⚠️ Attention needed"
            BADGE="warning"
          else
            OVERALL="✅ Healthy (minor items)"
            BADGE="passing"
          fi

          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          # 🏥 Aurevon Site Health Report — $NOW

          **Overall: $OVERALL**

          ## Site Status
          | Check | Result |
          |-------|--------|
          | API Health endpoint | HTTP $HTTP_STATUS |
          | All page routes (9 checked) | $( [ "$ALL_ROUTES" = "true" ] && echo "✅ All OK" || echo "❌ One or more failing" ) |
          | Vercel runtime logs | ⚠️ MCP token scope — check Vercel dashboard manually |
          | Discord bot (GCE) | ⚠️ Check the VM serial output — see deploy/gcp/README.md |

          ## GitHub Issues
          | Label | Count |
          |-------|-------|
          | All open issues | $TOTAL_ISSUES |
          | 🐛 bug | $BUGS |
          | 👤 customer-reported | $CUSTOMER |
          | 🎨 UX/UI | $UX |

          ## CI / Deployments
          - Recent CI failures (last 5 deploy runs): **$CI_FAILURES**
          - CI workflow: [deploy.yml](https://github.com/${{ github.repository }}/actions/workflows/deploy.yml)

          ## Functions
          - Serverless function count: **$HEALTH_FN**
          - Pipeline: **$HEALTH_PIPELINE**
          - Env completeness: **$HEALTH_ENV**

          ## Gaps (manual checks needed)
          - **Vercel**: Runtime error logs and traffic analytics require direct Vercel dashboard access (MCP token is personal-scope only)
          - **Discord bot**: runs on the Compute Engine VM `aurevon-discord-bot` — logs via `gcloud compute instances get-serial-port-output` (deploy/gcp/README.md)

          ---
          *Next scheduled check: ~8 hours · Workflow: [health-check.yml](https://github.com/${{ github.repository }}/actions/workflows/health-check.yml)*
          SUMMARY

          echo "Summary written."

      - name: Fail if health check returned non-200
        if: always() && steps.health.outputs.status != '200'
        run: |
          echo "::error::Health endpoint returned HTTP ${{ steps.health.outputs.status }} (expected 200; 503 = authed readiness failed)"
          echo "::error::Set the PRODUCTION_URL repository variable to override the default URL"
          exit 1

      - name: Fail if the pipeline is not ready
        if: always() && steps.parse.outputs.ready == 'false'
        env:
          PROBLEMS: ${{ steps.parse.outputs.problems }}
        run: |
          echo "::error::/api/health ok:false or HTTP 503 — problems: $PROBLEMS"
          exit 1
